<script src="../js/data.js"></script>

<script>
  const story = scenes.find(
      s => s.topic === "password-security"
  );
  const narrativeType = "fantasy";
  const visualStyle = "comic";
  const scenesData =  story.narratives[narrativeType].data;
  const totalScenes = scenesData.length;

  scenesData.forEach((scene,index)=>{
    const imageElement = document.getElementById(
        `scene${index+1}-image`
    );

    imageElement.src = scene.visual_style[visualStyle].image;


    document.getElementById(
        `scene${index+1}-text`
    ).innerHTML =
        scene.narrationVar
        .trim()
        .split("\n")
        .map(line => `<p>${line.trim()}</p>`)
        .join("");
    const progress = document.getElementById(`scene${index + 1}-progress`);

    for (let i = 0; i < totalScenes; i++) {
        const pip = document.createElement("div");
        pip.classList.add("pip");

        if (i < index)
            pip.classList.add("done");
        else if (i === index)
            pip.classList.add("active");

        progress.appendChild(pip);
    }
});

  document.getElementById("completeButton").addEventListener("click", function(event) {
  event.preventDefault();
  window.parent.postMessage(
      {
          type: "storyFinished"
      },
      "*"
  );
  });

  let sceneHistory = ["1"];
  function goTo(sceneId) {

      let currentScene = document.querySelector(".scene.active");

      if(currentScene) {
          let currentId = currentScene.id.replace("scene-", "");

          if(currentId !== sceneId) {
              sceneHistory.push(sceneId);
          }
      }

      document.querySelectorAll('.scene')
          .forEach(s => s.classList.remove('active'));
      document.getElementById('scene-' + sceneId)
          .classList.add('active');

      
    if (sceneId === "information") {
        renderInformationPanel(1, narrativeType);
    }
    if (sceneId === "information2") {
        renderInformationPanel(2, narrativeType);
    }


      window.scrollTo({
          top:0,
          behavior:'smooth'
      });
  }

  function goBack() {
      sceneHistory.pop();
      let previousScene = sceneHistory[sceneHistory.length - 1];
      if(previousScene) {
          document.querySelectorAll('.scene')
              .forEach(s => s.classList.remove('active'));

          document.getElementById('scene-' + previousScene)
              .classList.add('active');

          window.scrollTo({
              top:0,
              behavior:'smooth'
          });
      }
  }
</script>
