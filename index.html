<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Experiment</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Georgia, serif;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:320px;
}

.menu button{
    padding:18px;
    font-size:18px;
    cursor:pointer;

    background:transparent;
    border:1px solid #6a5a3a;
    color:#c8a96e;
    border-radius:6px;
    transition:.3s;
}

.menu button:hover{
    background:#6a5a3a;
    color:#111;
}
</style>

</head>

<body>

    <script>

        // Get language from SoSci URL
        const lang =
            new URLSearchParams(window.location.search).get("lang") || "en";
    
        console.log("Selected language:", lang);
    
    
        // Open scene and pass language along
        function openScene(scene) {
    
            window.location.href =
                scene + "?lang=" + encodeURIComponent(lang);
    
        }
    
    </script>
    
<div class="menu">


    <button onclick="openScene('scenes/fantasy-narrative.html')">
        Fantasy Narrative
    </button>

    <button onclick="openScene('scenes/fantasy-comic.html')">
      Fantasy + Comic
  </button>

  <button onclick="openScene('scenes/fantasy-realistic.html')">
        Fantasy + Realistic
    </button>

    <button onclick="location.href='scenes/real-comic.html'">
        Real-world + Comic
    </button>

    <button onclick="location.href='scenes/real-realistic.html'">
        Real-world + Realistic
    </button>

</div>


</body>
</html>
