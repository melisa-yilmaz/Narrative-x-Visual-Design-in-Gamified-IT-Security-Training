<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Experiment</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Georgia, serif;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:320px;
}

.menu button{
    padding:18px;
    font-size:18px;
    cursor:pointer;

    background:transparent;
    border:1px solid #6a5a3a;
    color:#c8a96e;
    border-radius:6px;
    transition:.3s;
}

.menu button:hover{
    background:#6a5a3a;
    color:#111;
}
</style>

</head>

<body>

    <script>
        const params = new URLSearchParams(window.location.search);

        const lang = params.get("lang") || "eng";
        const condition = params.get("condition");

            console.log("Language:", lang);
            console.log("Condition:", condition);

        const scenes = {
        "1": "scenes/fantasy-narrative.html",
        "2": "scenes/real-narrative.html",
        "3": "scenes/fantasy-comic.html",
        "4": "scenes/fantasy-realistic.html",
        "5": "scenes/real-comic.html",
        "6": "scenes/real-realistic.html"
        };


        // --------------------------------
        // Find selected scene
        // --------------------------------

        const selectedScene = scenes[condition];

        console.log("Selected scene:", selectedScene);

        if (selectedScene) {

            window.location.href =
                selectedScene +
                "?lang=" + encodeURIComponent(lang);

            } else {

            console.error("Invalid or missing condition:", condition);

            document.body.innerHTML = `
                <p style="
                    color:white;
                    text-align:center;
                    font-family:Georgia, serif;
                ">
                    Error: No valid experiment condition was provided.
                </p>
            `;
        }
        
    </script>
    

</body>
</html>
