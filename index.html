<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrative Experiment</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Georgia, serif;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:320px;
}

.menu button{
    padding:18px;
    font-size:18px;
    cursor:pointer;

    background:transparent;
    border:1px solid #6a5a3a;
    color:#c8a96e;
    border-radius:6px;
    transition:.3s;
}

.menu button:hover{
    background:#6a5a3a;
    color:#111;
}
</style>

</head>

<body>

    <div class="menu">

        <h1 id="welcomeText">Welcome!</h1>
    
    </div>
    
    <script>
    const lang = new URLSearchParams(window.location.search).get("lang") || "eng";
    
    console.log("Selected language:", lang);
    
    if (lang === "ger") {
        document.getElementById("welcomeText").textContent = "Willkommen!";
    } else {
        document.getElementById("welcomeText").textContent = "Welcome!";
    }

    </script>
</body>
</html>
